# Packages only ufonet_geo/, the shared core. The CLI scripts at the
# repo root keep using requirements.txt.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ufonet-geo"
dynamic = ["version"]
description = "Georeferencing core for WaterCam fixed cameras: pose, rays, terrain, flood-mask orthorectification"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dem = ["rasterio>=1.3", "pyproj>=3.6"]

[tool.setuptools]
packages = ["ufonet_geo"]

[tool.setuptools.dynamic]
version = { attr = "ufonet_geo.__version__" }
